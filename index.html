<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゴンちゃんポートフォリオ</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      line-height: 1.8;
      color: #333;
      background: #fffaf2;
    }

    header {
      padding: 80px 24px;
      text-align: center;
      color: white;
      background: #3d6b4f;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 16px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    section {
      margin-bottom: 24px;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000012;
    }

    h2 {
      color: #3d6b4f;
    }

    footer {
      padding: 30px;
      text-align: center;
      color: white;
      background: #3d6b4f;
    }
  </style>
</head>

<body>
  <header>
    <h1>まだ使える物と、地域の未来をつなぐ。</h1>
    <p>大阪・泉南から、仕事・田舎づくり・資格挑戦を発信します。</p>
  </header>

  <main>
    <section>
      <h2>ゴンゴリラサービス</h2>
      <p>不用品回収・リユース・運搬を通して、まだ使える物を次の人へつなぎます。</p>
    </section>

    <section>
      <h2>子どもたちが田舎をつくる</h2>
      <p>子どもたちと農家のおじいちゃんが、泉南で畑や自然に触れながら田舎づくりに挑戦します。</p>
    </section>

    <section>
      <h2>資格への挑戦</h2>
      <p>行政書士・第二種電気工事士など、仕事と地域活動に役立つ資格取得を目指します。</p>
    </section>
  </main>

  <footer>
    <p>ゴンちゃんポートフォリオ</p>
  </footer>
</body>
</html>
